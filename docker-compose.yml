# =============================================================================
# NextCRM — Full-Stack Docker Compose
# =============================================================================
# Usage:
#   Development:  docker compose up -d --build
#   Production:   docker compose --profile production up -d --build
#   Stop:         docker compose down
#   Reset:        docker compose down -v  (removes all data volumes)
# =============================================================================

services:
  # -------------------------------------------------------------------------
  # Infrastructure
  # -------------------------------------------------------------------------

  # --- PostgreSQL Database ---
  db:
    image: pgvector/pgvector:pg16
    container_name: crm-db
    ports:
      - "${POSTGRES_PORT_EXTERNAL:-5433}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-crm_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-crm_password_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-crm_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-crm_user} -d ${POSTGRES_DB:-crm_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # --- Redis (Cache + Celery Broker) ---
  redis:
    image: redis:7-alpine
    container_name: crm-redis
    ports:
      - "${REDIS_PORT_EXTERNAL:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # --- MinIO (S3-compatible File Storage) ---
  minio:
    image: minio/minio:latest
    container_name: crm-minio
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # -------------------------------------------------------------------------
  # Backend Services
  # -------------------------------------------------------------------------

  # --- FastAPI Application ---
  api:
    build:
      context: ./backend
      target: development
    container_name: crm-api
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      # App
      APP_NAME: ${APP_NAME:-CRM Pro API}
      APP_ENV: ${APP_ENV:-development}
      DEBUG: ${DEBUG:-true}
      API_V1_PREFIX: /api/v1
      BACKEND_CORS_ORIGINS: '["http://localhost:3000","http://frontend:3000"]'
      # Database
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-crm_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-crm_password_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-crm_db}
      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_URL: redis://redis:6379/0
      # JWT
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-to-a-random-64-char-string}
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-15}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-30}
      # MinIO
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_ENDPOINT: minio:9000
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-crm-files}
      MINIO_USE_SSL: "false"
      # Celery
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      # Logging
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # --- Celery Worker ---
  celery_worker:
    build:
      context: ./backend
      target: development
    container_name: crm-celery-worker
    command: celery -A app.workers.celery_app worker --loglevel=info
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-crm_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-crm_password_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-crm_db}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-to-a-random-64-char-string}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_ENDPOINT: minio:9000
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-crm-files}
      MINIO_USE_SSL: "false"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # -------------------------------------------------------------------------
  # Frontend
  # -------------------------------------------------------------------------

  # --- Next.js Application ---
  frontend:
    build:
      context: ./crm-app-next
      target: development
    container_name: crm-frontend
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-CRM Pro}
      BACKEND_API_URL: http://api:8000/api/v1
      AUTH_SECRET: ${AUTH_SECRET:-generate-me-with-openssl-rand-base64-32}
    volumes:
      - ./crm-app-next:/app
      - /app/node_modules
      - /app/.next
      - ./crm-app-next/.env.docker:/app/.env.local:ro
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  minio_data:
